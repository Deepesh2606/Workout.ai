<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="hsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3358" />
      <stop offset="50%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#FFA800" />
    </linearGradient>
    <linearGradient id="hsCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="hsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Obsidian Base with subtle border -->
  <rect width="64" height="64" rx="16" fill="#090D16" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#1C2438" stroke-width="1.5" />

  <!-- HyperState 'H' Glyph with kinetic cross-pulse -->
  <!-- Left Pillar -->
  <rect x="16" y="14" width="7" height="36" rx="3.5" fill="url(#hsGrad)" filter="url(#hsGlow)" />

  <!-- Right Pillar -->
  <rect x="41" y="14" width="7" height="36" rx="3.5" fill="url(#hsGrad)" filter="url(#hsGlow)" />

  <!-- Dynamic Hyper Cross-Bar with Bolt / Chevron Angle -->
  <path d="M21 34.5L34 26.5L43 32L30 40L21 34.5Z" fill="url(#hsGrad)" filter="url(#hsGlow)" />
  
  <!-- Electric Pulse Core -->
  <circle cx="32" cy="32" r="3" fill="url(#hsCyan)" filter="url(#hsGlow)" />
</svg>
